name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm --workspace=@broiler/shared run build

      - name: TypeScript Strict Type Check
        run: |
          npx tsc --noEmit -p packages/shared/tsconfig.json
          npx tsc --noEmit -p apps/api/tsconfig.json
          npx tsc --noEmit -p apps/mobile/tsconfig.json

      - name: Run Shared Formulas & Schemas Unit Tests
        run: npm --workspace=@broiler/shared test

      - name: Run Mobile Design System & Offline Queue Tests
        run: npm --workspace=@broiler/mobile test

      - name: Run API Middleware & Services Tests
        run: npm --workspace=@broiler/api test -- src/__tests__/rbac_middleware.test.ts src/__tests__/auth_middleware.test.ts src/__tests__/services.test.ts
