name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm --workspace=@broiler/shared run build

      - name: Prettier Code Style Verification
        run: npx prettier --check .

      - name: ESLint Verification
        run: npx eslint .

      - name: TypeScript Strict Type Check
        run: npm run type-check

      - name: Run Shared Formulas & Schemas Tests
        run: npm --workspace=@broiler/shared test

      - name: Run Mobile Offline SQLite & UI Component Tests
        run: npm --workspace=@broiler/mobile test

      - name: Run API End-to-End Supertest & RBAC Integration Tests
        run: npm --workspace=@broiler/api test
